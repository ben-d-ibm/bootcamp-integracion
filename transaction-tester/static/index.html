<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction Tester</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    color: #1a1a1a;
    font-size: 13px;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .card h2 { font-size: 12px; margin: 0 0 8px; color: #555; text-transform: uppercase; letter-spacing: .03em; }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 13px;
    font-family: monospace;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input { flex: 1; }
  button {
    padding: 6px 10px;
    border: none;
    border-radius: 5px;
    background: #2563eb;
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #6b7280; }
  button.secondary:hover { background: #4b5563; }
  button:disabled { background: #b7c3e0; cursor: not-allowed; }
  #cuentasBox { max-height: 160px; overflow-y: auto; margin-top: 8px; border: 1px solid #eee; border-radius: 5px; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { padding: 4px 6px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
  tr.acc-row { cursor: pointer; }
  tr.acc-row:hover { background: #eef2ff; }
  tr.selected { background: #dbeafe; }
  #selCuenta { font-family: monospace; font-size: 12px; margin-top: 6px; color: #333; min-height: 14px; }
  #enviarBtn { width: 100%; margin-top: 4px; padding: 9px; font-size: 13px; }
  #log { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
  .entry { border-bottom: 1px dashed #e5e5e5; padding: 6px 0; font-family: monospace; font-size: 11.5px; line-height: 1.5; }
  .entry:last-child { border-bottom: none; }
  .req { color: #2563eb; }
  .ok { color: #16a34a; font-weight: bold; }
  .err { color: #dc2626; font-weight: bold; }
  .dim { color: #888; }
  small.hint { color: #888; display: block; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔧 Transaction Tester</h1>

  <div class="card">
    <h2>1. URL del webhook</h2>
    <input type="text" id="url" placeholder="https://.../runflow/run/sync/v2/...">
    <small class="hint">Se guarda en este navegador.</small>
  </div>

  <div class="card">
    <h2>2. Cuenta</h2>
    <div class="row">
      <button id="cargarBtn">Cargar cuentas</button>
      <span id="cuentasStatus" class="dim"></span>
    </div>
    <div id="cuentasBox">
      <table>
        <thead><tr><th>Cuenta</th><th>Nombre</th><th>Tipo</th><th>Saldo</th></tr></thead>
        <tbody id="cuentasBody"></tbody>
      </table>
    </div>
    <div id="selCuenta">Sin cuenta seleccionada</div>
  </div>

  <div class="card">
    <h2>3. Monto</h2>
    <input type="number" id="monto" min="1" step="1" placeholder="Monto">

  </div>

  <button id="enviarBtn" disabled>Enviar transacción</button>

  <div class="card" style="margin-top:10px;">
    <h2>Registro</h2>
    <div id="log"></div>
  </div>
</div>

<script>
const urlInput = document.getElementById('url');
const montoInput = document.getElementById('monto');
const selCuenta = document.getElementById('selCuenta');
const enviarBtn = document.getElementById('enviarBtn');
const log = document.getElementById('log');
let cuentaSeleccionada = null;

urlInput.value = localStorage.getItem('tt_url') || '';
urlInput.addEventListener('input', () => {
  localStorage.setItem('tt_url', urlInput.value);
  actualizarBoton();
});
montoInput.addEventListener('input', actualizarBoton);

function actualizarBoton() {
  enviarBtn.disabled = !(urlInput.value.trim() && cuentaSeleccionada && montoInput.value.trim());
}

document.getElementById('cargarBtn').onclick = async () => {
  const status = document.getElementById('cuentasStatus');
  status.textContent = 'Cargando...';
  try {
    const res = await fetch('/api/cuentas');
    const data = await res.json();
    if (!res.ok) { status.textContent = 'Error: ' + (data.error || res.status); return; }
    const body = document.getElementById('cuentasBody');
    body.innerHTML = '';
    data.forEach(c => {
      const tr = document.createElement('tr');
      tr.className = 'acc-row';
      tr.innerHTML = `<td>${c.numero_cuenta.slice(-8)}</td><td>${c.nombre} ${c.apellido}</td><td>${c.tipo_cuenta}</td><td>${c.saldo}</td>`;
      tr.onclick = () => {
        document.querySelectorAll('tr.acc-row').forEach(r => r.classList.remove('selected'));
        tr.classList.add('selected');
        cuentaSeleccionada = c.numero_cuenta;
        selCuenta.textContent = `${c.numero_cuenta} — ${c.nombre} ${c.apellido}`;
        actualizarBoton();
      };
      body.appendChild(tr);
    });
    document.getElementById('cuentasBox').style.display = 'block';
    status.textContent = `${data.length} cuentas`;
  } catch (e) {
    status.textContent = 'Error: ' + e;
  }
};

enviarBtn.onclick = async () => {
  const url = urlInput.value.trim();
  const monto = parseInt(montoInput.value, 10);
  enviarBtn.disabled = true;
  const ts = new Date().toLocaleTimeString();

  try {
    const res = await fetch('/api/enviar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, numero_cuenta: cuentaSeleccionada, monto }),
    });
    const data = await res.json();
    const entry = document.createElement('div');
    entry.className = 'entry';
    if (data.ok) {
      entry.innerHTML = `
        <div class="dim">[${ts}]</div>
        <div class="req">→ REQUEST  ${data.sent.numero_cuenta}  $${data.sent.monto}  trx_id=${data.sent.trx_id}</div>
        <div class="${data.status_code < 400 ? 'ok' : 'err'}">← RESPONSE  ${data.status_code}</div>
        <div class="dim">${escapeHtml(data.response_body)}</div>`;
    } else {
      entry.innerHTML = `
        <div class="dim">[${ts}]</div>
        <div class="req">→ REQUEST  ${data.sent.numero_cuenta}  $${data.sent.monto}  trx_id=${data.sent.trx_id}</div>
        <div class="err">← ERROR</div>
        <div class="dim">${escapeHtml(data.error)}</div>`;
    }
    log.prepend(entry);
  } catch (e) {
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `<div class="dim">[${ts}]</div><div class="err">← ERROR</div><div class="dim">${escapeHtml(String(e))}</div>`;
    log.prepend(entry);
  } finally {
    actualizarBoton();
  }
};

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

actualizarBoton();
</script>
</body>
</html>
